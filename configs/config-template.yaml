# =================================================================
# AKS Cluster Configuration Template for Defender for Containers
# =================================================================
# 
# INSTRUCTIONS:
# 1. Copy this file to a new file (e.g., my-cluster.yaml)
# 2. Replace the placeholder values below with your actual cluster details
# 3. Run the simulation with: python enhanced_simulation.py --config my-cluster.yaml
#
# To find your cluster details, run: az aks list --output table
# =================================================================

aks_cluster:
  subscription_id: "YOUR_SUBSCRIPTION_ID"      # Replace with your Azure subscription ID
  resource_group: "YOUR_RESOURCE_GROUP"        # Replace with your resource group name  
  cluster_name: "YOUR_CLUSTER_NAME"            # Replace with your AKS cluster name
  
# =================================================================
# Advanced Configuration (Optional - defaults provided)
# =================================================================

helm:
  chart: "oci://ghcr.io/microsoft/defender-for-cloud/attacksimulation/mdc-simulation"
  release: "enhanced-mdc-simulation"
  namespace: "enhanced-mdc-simulation"
  
scenarios:
  basic:
    - "recon"
    - "lateral-mov" 
    - "secrets"
    - "crypto"
    - "webshell"
  
  enhanced:
    - "recon"
    - "lateral-mov"
    - "secrets"
    - "crypto"
    - "webshell"
    
  advanced:
    - "recon"
    - "secrets"
    - "crypto"
    
  all:
    - "recon"
    - "lateral-mov"
    - "secrets" 
    - "crypto"
    - "webshell"

timeouts:
  pod_creation: 300      # 5 minutes
  scenario_execution: 300 # 5 minutes
  helm_deployment: 300   # 5 minutes
  
monitoring:
  alert_check_interval: 60    # Check for alerts every 60 seconds
  max_wait_for_alerts: 3600   # Wait up to 1 hour for alerts
  
logging:
  level: "INFO"
  save_logs: true
  log_retention_days: 30
  
defender:
  expected_alerts:
    - "Possible Web Shell activity detected"
    - "Suspicious Kubernetes service account operation detected"
    - "Network scanning tool detected"
    - "Access to cloud metadata service detected"
    - "Sensitive files access detected"
    - "Possible secret reconnaissance detected"
    - "Kubernetes CPU optimization detected"
    - "Command within a container accessed ld.so.preload"
    - "Possible Crypto miners download detected"
    - "A drift binary detected executing in the container"
    - "Privileged container detected"
    - "Suspicious mount detected"
    - "Container with sensitive volume mount detected"
    - "Privileged operation detected"
    - "Container with high privileges detected"
    
cleanup:
  auto_cleanup: false  # Set to true for automatic cleanup
  cleanup_timeout: 300 # 5 minutes timeout for cleanup operations