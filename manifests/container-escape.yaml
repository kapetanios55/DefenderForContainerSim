# WARNING: This Job runs with privileged + hostPID + hostNetwork and mounts the node
# root filesystem and the containerd socket. It is a REAL container-escape primitive,
# not a mock: it grants effective host-root on the node it lands on. Run it ONLY on a
# disposable test cluster you own. The /host and containerd mounts are read-only here;
# the escape scenario only reads from them.
apiVersion: batch/v1
kind: Job
metadata:
  name: container-escape-simulation
  labels:
    app.kubernetes.io/name: defender-container-simulation
    app.kubernetes.io/component: container-escape
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defender-container-simulation
        app.kubernetes.io/component: container-escape
    spec:
      restartPolicy: Never
      hostPID: true
      hostNetwork: true
      containers:
        - name: container-escape
          image: mcr.microsoft.com/cbl-mariner/base/core:2.0
          securityContext:
            privileged: true
          command: ["/bin/bash", "/simulation/simulation.sh"]
          volumeMounts:
            - name: simulation-script
              mountPath: /simulation
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: simulation-script
          configMap:
            name: container-escape-simulation
            defaultMode: 0555
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket