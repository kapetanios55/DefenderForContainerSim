apiVersion: batch/v1
kind: Job
metadata:
  name: privilege-escalation-simulation
  labels:
    app.kubernetes.io/name: defender-container-simulation
    app.kubernetes.io/component: privilege-escalation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: defender-container-simulation
        app.kubernetes.io/component: privilege-escalation
    spec:
      restartPolicy: Never
      containers:
        - name: privilege-escalation
          image: mcr.microsoft.com/cbl-mariner/base/core:2.0
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          command: ["/bin/bash", "/simulation/simulation.sh"]
          volumeMounts:
            - name: simulation-script
              mountPath: /simulation
              readOnly: true
            - name: host-root
              mountPath: /host
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: simulation-script
          configMap:
            name: privilege-escalation-simulation
            defaultMode: 0555
        - name: host-root
          hostPath:
            path: /
            type: Directory